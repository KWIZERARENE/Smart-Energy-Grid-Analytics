services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    environment:
      POSTGRES_PASSWORD: password
      TZ: Africa/Kigali
      PGTZ: Africa/Kigali
    ports:
      - "5433:5432"
    volumes:
      - tsdata:/var/lib/postgresql/data

  emqx:
    image: emqx/emqx:latest
    container_name: emqx
    environment:
      TZ: Africa/Kigali
    ports:
      - "1883:1883"
      - "18083:18083"
    volumes:
      - emqxdata:/opt/emqx/data

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    environment:
      TZ: Africa/Kigali
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Africa/Kigali
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana

volumes:
  tsdata:
  emqxdata:
  grafanadata: